<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Robot ball pipeline</title><style>
    .iso{
      --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
      --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
      --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
      --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
      --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
      --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
      --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
      --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
      --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
      --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
    }
    .iso[data-theme="light"]{
      --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
      --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
      --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
      --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
      --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
      --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
      --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
      --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
    }
    .iso-svg{display:block;width:100%;height:auto;overflow:visible}
    .iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
    .iso-fill{fill:var(--anatomy-paper);stroke:none}
    .iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
    .iso-shade,.iso-top{stroke:none}
    .iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
    .iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
    .iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
    .iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
    .iso-top{fill:var(--anatomy-top)}
    .iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
    .iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
    .iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
    .iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
    .iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
    .iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
    .iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
    .iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
    .iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
    .iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
    .iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
    .iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
    .iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
    .iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
    .iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
    .iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
    .iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
    .iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
    .iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
    .iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
    .iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
    .iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
    .iso-line[data-dashed]{stroke-dasharray:3 3}
    .iso-line[data-flow]{stroke-dasharray:2 6}
    .iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
    .iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
    .iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
    .iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
    .iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
    .iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
    .iso-dots[data-tone="hi"] circle{opacity:.85}
    .iso-dots[data-tone="mid"] circle{opacity:.45}
    .iso-dots[data-tone="lo"] circle{opacity:.22}
    .iso-dots[data-tone="faint"] circle{opacity:.12}
    .iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
    .iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
    .iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
    .iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
    .tb-body{fill:var(--anatomy-shade-2);stroke:none}
    .tb-shine{fill:var(--anatomy-top);stroke:none}
    .tb-shade{fill:var(--anatomy-shade-0);stroke:none}
    .tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
    .tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
    .tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
    .tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
    @keyframes iso-flow{to{stroke-dashoffset:-32}}
    @keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
    .iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
    .iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
    .iso-figure{margin:32px 0 36px}
    .iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
    .iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
    .iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
    .iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
    .iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
    .iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
    .iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
    .iso-plate .iso-svg{margin:0 auto}
    .iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
    .iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
    .iso-key{display:inline-flex;align-items:center;gap:7px}
    .iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
    .iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
    .iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
    .iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
    .iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
    .iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
    .iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
    .iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
    .iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
    .iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
    .iso-swatch-crease{stroke:var(--anatomy-lo)!important}
    @media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
    @media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

    *{box-sizing:border-box}
    html{color-scheme:dark}
    body[data-theme="light"]{color-scheme:light}
    body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    .iso-page{width:min(1100px,100% - 32px);margin:64px auto 96px}

  else{const body=rot(bot.x,bot.y,bot.h,[[-10,-9],[10,-9],[10,9],[-10,9]]),cm=rot(bot.x,bot.y,bot.h,[[6,-3.5],[11,-3.5],[11,3.5],[6,3.5]]);
   s+=solidSvg(extrude(body,2,9,P,{}),{tone:"hi",crease:"lo"})+solidSvg(extrude(cm,11,5,P,{}),{tone:"hi",lit:true});
   for(let i=0;i<held;i++){const [sx,sy]=iso([bot.x,bot.y,14+i*4],P);s+='<circle cx="'+sx+'" cy="'+sy+'" r="'+2.4*P.scale+'" fill="'+Y+'"/>';}}
 }
 dyn.innerHTML=s;}
function drawCam(){let s='<rect x="1" y="1" width="198" height="118" rx="4" fill="none" stroke="'+T+'" stroke-opacity=".5"/><line x1="1" y1="30" x2="199" y2="30" stroke="'+T+'" stroke-opacity=".3"/><line x1="100" y1="1" x2="100" y2="119" stroke="'+T+'" stroke-opacity=".15"/>';
 for(const o of dets){const x=100+o.b/FOV*92,r=3+10*(1-o.d/RANGE),y=30+(1-o.d/RANGE)*78;s+='<rect x="'+(x-r-2)+'" y="'+(y-r-2)+'" width="'+(2*r+4)+'" height="'+(2*r+4)+'" fill="none" stroke="'+T+'" stroke-opacity=".7" stroke-dasharray="3 2"/><circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="'+Y+'"/><text x="'+x+'" y="'+(y-r-5)+'" font-size="7" text-anchor="middle" fill="'+T+'">'+o.d.toFixed(0)+' in</text>';}
 s+='<text x="6" y="113" font-size="7" fill="'+T+'" fill-opacity=".6">'+dets.length+' in view</text>';cam.innerHTML=s;}
const sc=160/F,mx=x=>x*sc,my=y=>(F-y)*sc;
function drawMap(){let s='<rect x="0" y="0" width="160" height="160" fill="none" stroke="'+T+'" stroke-opacity=".5"/>';
 for(let i=24;i<F;i+=24)s+='<path d="M'+mx(i)+' 0V160M0 '+my(i)+'H160" stroke="'+T+'" stroke-opacity=".12"/>';
 s+='<rect x="'+mx(132)+'" y="'+my(90)+'" width="'+12*sc+'" height="'+36*sc+'" fill="'+T+'" fill-opacity=".2"/><circle cx="'+mx(SHOOT.x)+'" cy="'+my(SHOOT.y)+'" r="6" fill="none" stroke="'+T+'" stroke-dasharray="3 2" stroke-opacity=".6"/>';
 const a0=bot.h-FOV,a1=bot.h+FOV;s+='<path d="M'+mx(bot.x)+' '+my(bot.y)+'L'+mx(bot.x+Math.cos(a0)*RANGE)+' '+my(bot.y+Math.sin(a0)*RANGE)+'L'+mx(bot.x+Math.cos(a1)*RANGE)+' '+my(bot.y+Math.sin(a1)*RANGE)+'Z" fill="'+T+'" fill-opacity=".07" stroke="'+T+'" stroke-opacity=".3"/>';
 if(obsOn)for(const o of OBS)s+='<circle cx="'+mx(o.x)+'" cy="'+my(o.y)+'" r="'+o.r*sc+'" fill="'+T+'" fill-opacity=".4"/>';
 if(mode==="auto")for(const z of zones)s+='<circle cx="'+mx(z.x)+'" cy="'+my(z.y)+'" r="'+14*sc+'" fill="none" stroke="'+T+'" stroke-opacity="'+0.15*Math.min(z.w,2.5)+'" stroke-dasharray="2 4"/>';
 for(const [x,y] of truth)s+='<circle cx="'+mx(x)+'" cy="'+my(y)+'" r="2.2" fill="none" stroke="'+Y+'" stroke-opacity=".35" stroke-dasharray="1.5 1.5"/>';
 if(st===1)for(const e of map)s+='<circle cx="'+mx(e.x)+'" cy="'+my(e.y)+'" r="'+MERGE*sc+'" fill="none" stroke="'+T+'" stroke-opacity=".4" stroke-dasharray="2 2"/>';
 if(st>=2&&st<=5)for(const c of clusters)s+='<circle cx="'+mx(c.x)+'" cy="'+my(c.y)+'" r="'+c.r*sc+'" fill="'+T+'" fill-opacity=".06" stroke="'+T+'" stroke-opacity=".7" stroke-dasharray="4 3"/><text x="'+mx(c.x)+'" y="'+(my(c.y)-c.r*sc-3)+'" font-size="7" text-anchor="middle" fill="'+T+'">'+c.m.length+'</text>';
 if(st>=4&&st<=5)s+='<path d="M'+chainPts(st===5?wp:route).map(p=>mx(p[0])+' '+my(p[1])).join('L')+'" fill="none" stroke="'+Y+'" stroke-width="1.4" stroke-dasharray="4 2"/>';
 for(const e of map){const r=2.6+2.5/Math.sqrt(e.n);s+='<circle cx="'+mx(e.x)+'" cy="'+my(e.y)+'" r="'+r+'" fill="'+Y+'" fill-opacity="'+(mode==="auto"?(fresh(e)?0.95:0.25):0.9)+'"'+(pick.includes(e)&&st>=3?' stroke="'+T+'" stroke-width="1.4"':'')+'/>';}
 if(st===0&&mode==="drag")s+='<circle cx="'+mx(bot.x)+'" cy="'+my(bot.y)+'" r="11" fill="'+T+'" fill-opacity=".08" stroke="'+T+'" stroke-dasharray="3 3"/>';
 if(path&&(st===5||st===0)){s+='<path d="M'+pathPts(path).map(p=>mx(p[0])+' '+my(p[1])).join('L')+'" fill="none" stroke="'+Y+'" stroke-width="2"/><path d="M'+path.P.map(p=>mx(p.x)+' '+my(p.y)).join('L')+'" fill="none" stroke="'+T+'" stroke-opacity=".35" stroke-dasharray="2 2"/>';for(const c of path.P)s+='<rect x="'+(mx(c.x)-2)+'" y="'+(my(c.y)-2)+'" width="4" height="4" fill="none" stroke="'+T+'"/>';}
 if(rivalOn)s+='<circle cx="'+mx(rival.x)+'" cy="'+my(rival.y)+'" r="'+22*sc+'" fill="none" stroke="'+T+'" stroke-opacity=".35" stroke-dasharray="2 3"/>';
 if(rivalOn)s+='<rect x="'+(mx(rival.x)-5)+'" y="'+(my(rival.y)-5)+'" width="10" height="10" fill="none" stroke="'+T+'" stroke-width="1.5"/><text x="'+mx(rival.x)+'" y="'+(my(rival.y)+2.5)+'" font-size="7" text-anchor="middle" fill="'+T+'">R</text>';
 s+='<path d="M'+rot(mx(bot.x),my(bot.y),-bot.h,[[7,0],[-5,-5],[-5,5]]).map(p=>p.join(' ')).join('L')+'Z" fill="'+T+'"/>';mp.innerHTML=s;}
function ui(){steps.querySelectorAll("span").forEach(e=>e.dataset.on=(+e.dataset.i===st)?1:0);
 let d=DESC[st];
 if(mode==="auto"){if(st===0){d="No spin. The robot uses whatever is in its field of view right now. If nothing is, it drives toward the zone where balls usually are.";if(!truth.length)d+=" No balls left. Re-place or refill.";}if(st===1)d="Detections within 10 in merge. Anything not seen for half a second counts as stale and fades.";if(st===5)d="PedroPathing curves toward what the camera sees now. A nearer or extra ball in view builds a new path; lost balls drop out. Obstacles and the rival are avoided. Drag a ball to simulate interference.";}
 else if(st===0){d=DESC[0]+" Drag a ball to move it.";if(!map.length)d+=truth.length?" Find a ball first.":" No balls left. Re-place or refill.";}
 desc.textContent=d;ro.textContent=NAMES[st].toLowerCase()+" · "+map.length+" mapped · "+held+" held · "+bag+" in goal"+(mode==="auto"?" · "+replans+" replans":"");
 const on=st===0&&mode==="drag",s0=st===0||mode==="auto";hd.disabled=!on;hd.style.opacity=on?1:.4;if(!on||document.activeElement!==hd)hd.value=Math.round(((bot.h*180/Math.PI)%360+360)%360);hv.textContent=hd.value+"°";
 stage.style.touchAction=mp.style.touchAction=s0?"none":"auto";if(placing&&(bag<1||!s0))placing=false;
 pl.disabled=!(s0&&bag>0);pl.textContent="Re-place balls ("+bag+")";pl.setAttribute("aria-pressed",placing?"true":"false");}
let last=0;function tick(now){const dt=Math.min((now-last)/1000||0.016,1/20);last=now;if(!paused)step(dt);draw3d();drawCam();drawMap();ui();requestAnimationFrame(tick);}
document.getElementById("pp").onclick=e=>{paused=!paused;e.target.textContent=paused?"Play":"Pause";};
document.getElementById("nx").onclick=()=>{skip=true;paused=false;document.getElementById("pp").textContent="Pause";};
const hd=document.getElementById("hd"),hv=document.getElementById("hv"),CM=cameraOf(P);
hd.oninput=()=>{if(st===0&&mode==="drag")bot.h=hd.value*Math.PI/180;};
function fromStage(e){const r=stage.querySelector("svg").getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*640,sy=(e.clientY-r.top)/r.height*400,u=(sx-P.origin[0])/CM.k,v=(sy-P.origin[1])/(CM.k*CM.sinE);return[u*CM.sinA+v*CM.cosA,-u*CM.cosA+v*CM.sinA];}
function fromMap(e){const r=mp.getBoundingClientRect();return[(e.clientX-r.left)/r.width*F,F-(e.clientY-r.top)/r.height*F];}
let drag=null;
const md=document.getElementById("md"),ma=document.getElementById("ma"),pl=document.getElementById("pl"),rf=document.getElementById("rf");
const clampF=v=>Math.max(8,Math.min(F-8,v));
const near=q=>{let b=null,bd=8;for(const t of truth){const d=Math.hypot(t[0]-q[0],t[1]-q[1]);if(d<bd){bd=d;b=t;}}return b;};
function down(e,f,node){if(st!==0&&mode!=="auto")return;const q=f(e);
 if(placing&&bag>0){const t=[clampF(q[0]),clampF(q[1])];truth.push(t);bag--;drag={ball:t};}
 else{const b=near(q);if(b){const j=map.findIndex(m=>Math.hypot(m.x-b[0],m.y-b[1])<12);if(j>=0)map.splice(j,1);drag={ball:b};}else if(mode==="drag")drag={bot:1};else return;}
 node.setPointerCapture(e.pointerId);move(e,f);}
function move(e,f){if(!drag)return;const q=f(e),x=clampF(q[0]),y=clampF(q[1]);if(drag.ball){drag.ball[0]=x;drag.ball[1]=y;if(obsOn)for(const o of OBS){const dx=x-o.x,dy=y-o.y,d=Math.hypot(dx,dy)||1,m=o.r+18;if(d<m){drag.ball[0]=o.x+dx/d*m;drag.ball[1]=o.y+dy/d*m;}}}else{bot.x=x;bot.y=y;}}
for(const [node,f] of [[stage,fromStage],[mp,fromMap]]){node.addEventListener("pointerdown",e=>down(e,f,node));node.addEventListener("pointermove",e=>move(e,f));node.addEventListener("pointerup",()=>{drag=null;});node.addEventListener("pointercancel",()=>{drag=null;});}
function setMode(m){path=null;mode=m;sweep=0;scanT=0;searchT=0;wp=[];md.setAttribute("aria-pressed",m==="drag"?"true":"false");ma.setAttribute("aria-pressed",m==="auto"?"true":"false");}
md.onclick=()=>setMode("drag");ma.onclick=()=>setMode("auto");
const ob=document.getElementById("ob");ob.onclick=()=>{obsOn=!obsOn;ob.setAttribute("aria-pressed",obsOn?"true":"false");path=null;if(obsOn)for(let i=truth.length-1;i>=0;i--)if(!okp(truth[i])){truth.splice(i,1);addBall();}};
const rv=document.getElementById("rv");rv.onclick=()=>{rivalOn=!rivalOn;rv.setAttribute("aria-pressed",rivalOn?"true":"false");if(rivalOn){rival.x=122;rival.y=122;rival.tgt=null;}};
pl.onclick=()=>{placing=!placing&&bag>0;};
rf.onclick=()=>{path=null;scanT=0;searchT=0;replans=0;spawn();map=[];clusters=[];pick=[];route=[];flying=[];wp=[];held=0;bag=0;placing=false;st=0;t=0;sweep=0;};
reset();requestAnimationFrame(tick);
</script></body></html>
